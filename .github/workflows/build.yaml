name: Build Windows EXE

# Déclenchement uniquement manuel (workflow_dispatch)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements.txt

    # Commit exact embarqué dans l'exécutable (traçabilité : scripts/core/version.py)
    - name: Write build info
      shell: bash
      run: |
        echo "COMMIT = \"${GITHUB_SHA::12}\"" > scripts/_build_info.py
        cat scripts/_build_info.py

    - name: Build EXE
      run: |
        pyinstaller --onefile --windowed --name TGV main.py --hidden-import yaml --hidden-import scripts._build_info --add-data "assets;assets" --add-data "configs;configs"

    - name: Show dist folder
      run: |
        echo "Listing dist folder:"
        dir dist

    - name: Upload EXE artifact
      uses: actions/upload-artifact@v4
      with:
        name: TGV-exe
        path: dist/TGV.exe
        compression-level: 0
