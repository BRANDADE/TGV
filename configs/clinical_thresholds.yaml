        document: "Interne"
        version: "08-2026"

    classification_mode: "simple"
    repeat_mode: "sum_with_interruptions"
    genotype_display: "pathogenic_only"
    orientation: "FW"

    # Table : CAG + CAA. Le BED ne déclare pas de motif CAA (MOTIFS=CAG,CCG) :
    # le CAA de la structure (CAG)n-CAA-CAG est une interruption interne au
    # groupe CAG. En mode sum_with_interruptions, il est ajouté au total
    # (total = CAG + CAA ≈ CAG pur + 2 sur un allèle canonique).
    # ⚠ Les seuils GeneReviews portent sur le CAG pur (voir CSV).
    # ⚠ À calibrer sur un échantillon de taille connue : le résultat dépend
    #   de la segmentation TRGT (MS) du CAG isolé qui suit le CAA.
    # Tract CCG en aval (interruptions CCG/CGC de la table) : hors groupe, non compté.
    motif_properties:
        pathogenic_motifs: ["CAG"]
        pure_only: false

        motif_groups:
            CAG: ["CAG"]

    thresholds:
        # Table : normal < 27, pathogène > 35.
        CAG:
            "normal": [0, 26]
            "intermediate": [27, 35]
            "pathogenic": [36, null]

    structure_rules: []

