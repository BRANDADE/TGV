SCA10_ATXN10:
    source:
        document: "Interne"
        version: "08-2026"

    classification_mode: "simple"
    repeat_mode: "sum_without_interruptions"
    genotype_display: "pathogenic_only"
    orientation: "FW"

    motif_properties:
        pathogenic_motifs: ["ATTCT"]
        pure_only: false

        # ⚠ ATTGT et TTTCT ne figurent pas dans le BED (MOTIFS=ATTCT) :
        #   TRGT ne les compte pas, ces deux groupes restent à 0 tant que
        #   le BED n'est pas modifié.
        motif_groups:
            ATTCT: ["ATTCT"]
            ATTGT: ["ATTGT"]
            TTTCT: ["TTTCT"]

    thresholds:
        # Table : normal < 30, pathogène > 799.
        ATTCT:
            "normal": [0, 29]
            "intermediate": [30, 799]
            "pathogenic": [800, null]

        # Table : VSI.
        ATTGT:
            "normal": [0, 29]
            "ambiguous": [30, null]

